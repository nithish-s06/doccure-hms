    <!-- Feature module bundles. Classic scripts with `defer` (not type="module")
     so each block's onclick="fn(...)" HTML — generated by row-action
     renderers — keeps resolving against a top-level `function fn(){}`
     exposed globally, exactly as it did when each page loaded its own
     standalone script. `defer` still guarantees these run after parsing,
     in document order, after script.js's module above (module and defer
     scripts share one ordered post-parse execution queue) — so MC.* is
     already defined by the time these run. Each page-specific block inside
     self-guards on its own page anchor element, so it is safe (and
     intentional) to load every bundle on every page — irrelevant blocks
     simply no-op. Order relative to each other doesn't matter. -->
    <script defer src="assets/js/hr-admin-module.js"></script>
