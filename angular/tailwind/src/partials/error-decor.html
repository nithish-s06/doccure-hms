<!-- Decorative Background -->
<div class="absolute inset-0 -z-1 overflow-hidden pointer-events-none" aria-hidden="true">
    <!-- Gradient blobs -->
    <div class="absolute -top-32 -left-24 w-[28rem] h-[28rem] rounded-full bg-primary-200 dark:bg-primary-600/20 opacity-50 dark:opacity-100 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-24 w-[32rem] h-[32rem] rounded-full bg-sky-200 dark:bg-sky-500/10 opacity-50 blur-3xl"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full bg-amber-100 dark:bg-amber-500/10 opacity-40 blur-3xl"></div>

    <!-- Dotted grid -->
    <div class="absolute inset-0 opacity-[0.35] dark:opacity-20 bg-[radial-gradient(circle,#94a3b8_1px,transparent_1px)] bg-[length:26px_26px] [mask-image:radial-gradient(ellipse_at_center,black_10%,transparent_70%)]"></div>

    <!-- Floating medical crosses -->
    <i class="icon-plus absolute top-24 left-[12%] text-4xl text-primary/15 dark:text-primary-400/20 animate-[float-soft_7s_ease-in-out_infinite]"></i>
    <i class="icon-plus absolute bottom-32 left-[8%] text-2xl text-emerald-500/20 animate-[float-soft_5s_ease-in-out_infinite]"></i>
    <i class="icon-plus absolute top-40 right-[10%] text-3xl text-amber-500/20 animate-[float-soft_5s_ease-in-out_infinite]"></i>
    <i class="icon-activity absolute bottom-24 right-[14%] text-4xl text-primary/15 dark:text-primary-400/20 animate-[float-soft_7s_ease-in-out_infinite]"></i>
</div>

<!-- Theme Toggle -->
<div class="fixed top-4 right-4 z-50">
    <button type="button" aria-label="Switch to dark mode" class="light-dark-mode flex items-center justify-center w-10 h-10 rounded-lg bg-white dark:bg-slate-800 border border-border-color shadow-sm text-gray-900 hover:text-primary hover:bg-gray-50 dark:hover:bg-slate-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900 transition-colors">
        <i class="icon-moon text-xl!"></i>
    </button>
</div>
