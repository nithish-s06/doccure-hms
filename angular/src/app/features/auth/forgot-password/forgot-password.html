<!-- Card -->
<div class="relative rounded-3xl">
    <div class="absolute -inset-0.5 rounded-3xl bg-gradient-to-br from-blue-500/25 via-transparent to-fuchsia-500/25 opacity-70 blur-[2px]"></div>
    <div class="relative rounded-3xl bg-white dark:bg-slate-900 border border-gray-200/70 dark:border-white/10 p-6 sm:p-8 lg-card-shadow">
        <div class="mb-6">
            <span class="inline-grid size-12 place-items-center rounded-2xl text-white text-lg mb-4 lg-icon-badge"><i class="icon-key-round"></i></span>
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-gray-900 dark:text-white">Forgot password?</h2>
            <p class="text-gray-500 dark:text-gray-400 mt-1.5 text-sm">Enter the email linked to your account and we'll send you a secure reset link.</p>
        </div>

        <form data-submit-redirect="reset-password.html" class="space-y-4">
            <div class="relative">
                <input type="email" id="email" name="email" placeholder=" " class="fl-input peer w-full rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 pl-11 pr-10 py-3.5 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 transition-all">
                <i class="icon-mail fl-icon absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 transition-colors"></i>
                <label for="email" class="fl-label">Email address</label>
                <i class="icon-check-circle fl-ok absolute right-3.5 top-1/2 -translate-y-1/2 text-emerald-500"></i>
            </div>

            <button type="submit" class="lg-cta w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 font-bold text-[15px] shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2">
                <span class="js-cta-default flex items-center gap-2"><i class="icon-send"></i>Send Reset Link</span>
                <span class="js-cta-loading hidden items-center gap-2"><span class="lg-spin size-4 rounded-full border-2 border-white/40 border-t-white"></span>Sending link…</span>
            </button>
        </form>

        <div class="mt-5 flex items-start gap-3 rounded-xl border border-blue-100 dark:border-blue-500/20 bg-blue-50/70 dark:bg-blue-500/10 px-3.5 py-3">
            <span class="grid size-8 shrink-0 place-items-center rounded-lg bg-blue-600/10 text-blue-600 dark:text-blue-400"><i class="icon-info text-sm"></i></span>
            <div>
                <p class="text-[11px] font-bold text-blue-700 dark:text-blue-300 uppercase tracking-wide">Didn't receive it?</p>
                <p class="text-[11px] text-blue-600/80 dark:text-blue-300/70">Check your spam folder, or contact your hospital administrator to verify your registered address.</p>
            </div>
        </div>
    </div>
</div>

<p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
    Remembered your password? <a [routerLink]="AllRoutes.login" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Back to sign in</a>
</p>
