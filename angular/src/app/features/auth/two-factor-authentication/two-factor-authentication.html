
<!-- Card -->
<div class="relative rounded-3xl">
    <div class="absolute -inset-0.5 rounded-3xl bg-gradient-to-br from-blue-500/25 via-transparent to-fuchsia-500/25 opacity-70 blur-[2px]"></div>
    <div class="relative rounded-3xl bg-white dark:bg-slate-900 border border-gray-200/70 dark:border-white/10 p-6 sm:p-8 lg-card-shadow">
        <div class="mb-6">
            <span class="inline-grid size-12 place-items-center rounded-2xl text-white text-lg mb-4 lg-icon-badge"><i class="icon-shield-check"></i></span>
            <h2 class="text-2xl sm:text-3xl font-black tracking-tight text-gray-900 dark:text-white">Two-factor authentication</h2>
            <p class="text-gray-500 dark:text-gray-400 mt-1.5 text-sm">Open your authenticator app and enter the 6-digit code for Dreams HMS.</p>
        </div>

        <form data-submit-redirect="index.html" class="space-y-5">
            <fieldset>
                <legend class="sr-only">Authentication code</legend>
                <div class="flex items-center justify-between gap-2" data-otp>
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" value="9" class="otp-input is-filled w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" value="1" class="otp-input is-filled w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" value="4" class="otp-input is-filled w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" value="7" class="otp-input is-filled w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" placeholder="—" class="otp-input w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-300 dark:placeholder-slate-600 focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                    <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" placeholder="—" class="otp-input w-full h-14 text-center text-xl font-black rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-gray-900 dark:text-white placeholder-gray-300 dark:placeholder-slate-600 focus:outline-none focus:ring-4 focus:ring-blue-500/15 focus:border-blue-500">
                </div>
            </fieldset>

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-2.5 cursor-pointer select-none">
                    <span class="relative inline-grid place-items-center">
                        <input type="checkbox" checked class="lg-cb peer sr-only">
                        <span class="lg-cb-box grid size-5 place-items-center rounded-md border-2 border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 transition-colors">
                            <i class="icon-check lg-cb-tick text-[11px] text-white"></i>
                        </span>
                    </span>
                    <span class="text-sm font-medium text-gray-600 dark:text-gray-300">Trust this device for 30 days</span>
                </label>
                <span class="inline-flex items-center gap-1.5 text-sm font-semibold text-gray-400 dark:text-gray-500 tabular-nums">
                    <i class="icon-clock text-sm"></i><span id="tfa-timer">00:42</span>
                </span>
            </div>

            <button type="submit" class="lg-cta w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 font-bold text-[15px] shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2">
                <span class="js-cta-default flex items-center gap-2"><i class="icon-shield-check"></i>Verify &amp; Continue</span>
                <span class="js-cta-loading hidden items-center gap-2"><span class="lg-spin size-4 rounded-full border-2 border-white/40 border-t-white"></span>Verifying…</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="my-5 flex items-center gap-4">
            <div class="flex-1 h-px bg-gray-200 dark:bg-white/10"></div>
            <span class="text-xs font-medium text-gray-400">or verify another way</span>
            <div class="flex-1 h-px bg-gray-200 dark:bg-white/10"></div>
        </div>

        <div class="space-y-2.5">
            <a href="otp-verification.html" class="lg-social flex items-center gap-3 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-slate-800 p-3 hover:border-gray-300 dark:hover:border-white/20">
                <span class="grid size-9 place-items-center rounded-lg text-white shrink-0 [background:linear-gradient(135deg,#0ea5e9,#0369a1)]"><i class="icon-smartphone"></i></span>
                <span class="flex-1 min-w-0">
                    <span class="block text-sm font-bold text-gray-900 dark:text-white">Send a code via SMS</span>
                    <span class="block text-xs text-gray-500 dark:text-gray-400">Ending in •••• 4821</span>
                </span>
                <i class="icon-chevron-right text-gray-400"></i>
            </a>
            <a href="#" class="lg-social flex items-center gap-3 rounded-xl border border-gray-200 dark:border-white/10 bg-white dark:bg-slate-800 p-3 hover:border-gray-300 dark:hover:border-white/20">
                <span class="grid size-9 place-items-center rounded-lg text-white shrink-0 [background:linear-gradient(135deg,#8b5cf6,#6d28d9)]"><i class="icon-key-round"></i></span>
                <span class="flex-1 min-w-0">
                    <span class="block text-sm font-bold text-gray-900 dark:text-white">Use a backup code</span>
                    <span class="block text-xs text-gray-500 dark:text-gray-400">8 unused codes remaining</span>
                </span>
                <i class="icon-chevron-right text-gray-400"></i>
            </a>
        </div>
    </div>
</div>

<p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
    Lost access to your device? <a href="contact-us.html" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Contact your administrator</a>
</p>
