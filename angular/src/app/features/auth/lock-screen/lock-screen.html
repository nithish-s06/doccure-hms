<!-- Card -->
<div class="relative rounded-3xl">
    <div class="absolute -inset-0.5 rounded-3xl bg-gradient-to-br from-blue-500/25 via-transparent to-fuchsia-500/25 opacity-70 blur-[2px]"></div>
    <div class="relative rounded-3xl bg-white dark:bg-slate-900 border border-gray-200/70 dark:border-white/10 p-6 sm:p-8 lg-card-shadow">
        <div class="mb-6 text-center">
            <div class="relative inline-flex mb-4">
                <img src="assets/img/avatar/avatar-01.jpg" alt="" class="size-20 rounded-2xl object-cover ring-4 ring-white dark:ring-slate-800 shadow-lg">
                <span class="absolute -bottom-1.5 -right-1.5 grid size-8 place-items-center rounded-xl text-white ring-4 ring-white dark:ring-slate-900 lg-icon-badge"><i class="icon-lock text-xs"></i></span>
            </div>
            <h2 class="text-2xl font-black tracking-tight text-gray-900 dark:text-white">Dr. Sarah Chen</h2>
            <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">Your session is locked. Enter your password to resume.</p>
        </div>

        <form data-submit-redirect="index.html" class="space-y-4">
            <div class="relative">
                <input type="password" id="password" name="password" value="password123" placeholder=" " class="fl-input peer w-full rounded-xl border border-gray-200 dark:border-slate-600 bg-white dark:bg-slate-800 pl-11 pr-12 py-3.5 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 transition-all">
                <i class="icon-lock fl-icon absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 transition-colors"></i>
                <label for="password" class="fl-label">Password</label>
                <button type="button" aria-label="Show password" class="absolute right-2.5 top-1/2 -translate-y-1/2 grid size-8 place-items-center rounded-lg text-gray-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-white/10 transition-colors">
                    <i class="icon-eye"></i>
                </button>
            </div>

            <button type="submit" class="lg-cta w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 font-bold text-[15px] shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2">
                <span class="js-cta-default flex items-center gap-2"><i class="icon-unlock"></i>Unlock Session</span>
                <span class="js-cta-loading hidden items-center gap-2"><span class="lg-spin size-4 rounded-full border-2 border-white/40 border-t-white"></span>Unlocking…</span>
            </button>
        </form>

        <div class="mt-5 flex items-center gap-3 rounded-xl border border-blue-100 dark:border-blue-500/20 bg-blue-50/70 dark:bg-blue-500/10 px-3.5 py-3">
            <span class="grid size-8 shrink-0 place-items-center rounded-lg bg-blue-600/10 text-blue-600 dark:text-blue-400"><i class="icon-shield-check text-sm"></i></span>
            <div class="min-w-0">
                <p class="text-[11px] font-bold text-blue-700 dark:text-blue-300 uppercase tracking-wide">Security notice</p>
                <p class="text-[11px] text-blue-600/80 dark:text-blue-300/70">Sessions lock after 15 minutes of inactivity to protect patient data.</p>
            </div>
        </div>
    </div>
</div>

<p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
    Not you? <a [routerLink]="AllRoutes.login" class="font-bold text-blue-600 dark:text-blue-400 hover:underline">Sign in with a different account</a>
</p>
