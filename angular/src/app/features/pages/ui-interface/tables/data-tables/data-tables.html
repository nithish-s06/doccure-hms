<!-- Start grid -->
<div class="grid grid-cols-1">
	<div
		class="preview-card bg-white rounded-md border border-border-color p-5 pb-0">
		<div
			class="pb-5 mb-5 flex items-center xxl:gap-0 gap-3 justify-between flex-wrap border-b border-border-color">
			<h2 class="text-lg font-bold c-text mb-0">Data Table</h2>
			<button type="button" data-toggle="code"
				class="flex items-center gap-2 border py-1.5 px-2.5 text-xs border-border-color font-semibold rounded-md bg-[var(--card2)]  focus:bg-primary focus:border-primary focus:text-white text-gray-900 dark:text-dark dark:focus:text-dark">
				<i class="icon icon-eye"></i>
				<span class="code-btn">Show Code</span>
			</button>
		</div>
		<div class="pb-3 flex items-center justify-between gap-3 flex-wrap">
			<h5 class="text-[17.5px]">Data List</h5>
			<div class="flex items-center">
				<div id="tablesearch">
					 <app-common-search
          [totalData]="totalData()"
          [pageSize]="pageSize()"
          [tableDataCopy]="tableDataCopy()"
          [serialNumberArray]="serialNumberArray()"
          (dataChange)="updateTable($any($event))"
        ></app-common-search>
				</div>
			</div>
		</div>
		<div class="preview-content overflow-auto">
			<table matSort (matSortChange)="sortData($event)"
				class="mat-sort datatable border border-border-color dataTable w-full">
				<thead class="border border-border-color bg-white">
					<tr>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="Name">Name</th>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="position">Position</th>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="office">Office</th>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="age">Age</th>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="date">Start date</th>
						<th class="px-4 py-2 bg-white text-dark text-start"
							mat-sort-header="salary">Salary</th>
					</tr>
				</thead>
				<tbody>
					@for (data of tableData(); track $index) {
					<tr class="border-b border-border-color bg-white">
						<td class="px-4 py-3 text-start">{{ data.name }}</td>
						<td class="px-4 py-3 text-start">{{ data.position }}</td>
						<td class="px-4 py-3 text-start">{{ data.office }}</td>
						<td class="px-4 py-3 text-start">{{ data.age }}</td>
						<td class="px-4 py-3 text-start">{{ data.startDate }}</td>
						<td class="px-4 py-3 text-start">{{ data.salary }}</td>
					</tr>
					}
				</tbody>
			</table>
			<app-custom-pagination></app-custom-pagination>
			<div class="grid grid-cols-12 px-4 gap-2 py-3">
				<div class="sm:col-span-4 col-span-12">
					<div id="tablelength" class="flex justify-center sm:block"></div>
				</div>
				<div class="sm:col-span-4 col-span-12 flex items-center justify-center">
					<div id="tablepage" class="flex justify-center sm:block"></div>
				</div>
				<div
					class="sm:col-span-4 col-span-12 flex items-center sm:justify-end justify-center">
					<div id="tableinfo" class="flex justify-center sm:block"></div>
				</div>
			</div>
		</div>
		<pre
			class="code hidden relative mt-4 p-0! bg-dark text-gray-100 text-sm  overflow-hidden">
<button type="button" data-copy class="sticky float-end top-3 right-3 z-10 bg-gray-800 text-white text-xs px-2.5 py-1.5 rounded-md hover:bg-gray-700 flex items-center gap-1"><i class="icon icon-copy"></i><span>Copy</span></button>
<code class="language-html block w-full max-h-[400px] mb-[-42px] mt-[-10px]! overflow-auto p-4 pr-16" [innerHTML]="codesnippet">

</code>
</pre>

	</div>
</div>
<!-- End grid -->
