<div class="max-w-7xl mx-auto space-y-5">
		<nav aria-label="Breadcrumb" data-aos="fade-up" class="aos-init aos-animate">
		<ol class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
			<li><a [routerLink]="AllRoutes.index" class="hover:text-primary transition-colors">Dashboard</a></li>
			<li aria-hidden="true"><i class="icon-chevron-right text-[10px]"></i></li>

			<li class="font-medium text-gray-900 dark:text-gray-200" aria-current="page">Email</li>
		</ol>
	</nav>

		<div class="flex items-center justify-between" data-aos="fade-up">
			<div>
				<h1 class="text-2xl font-bold text-gray-900">Email</h1>
				<p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Inbox for hospital correspondence.</p>
			</div>
			<a [routerLink]="AllRoutes.emailCompose" class="flex items-center gap-2 bg-primary hover:bg-primary-hover text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
				<i class="icon-square-pen"></i>
				Compose
			</a>
		</div>

		<div class="card overflow-hidden" data-aos="fade-up" data-aos-delay="50">
			<div class="flex flex-col sm:flex-row">
				<div class="sm:w-56 shrink-0 border-b sm:border-b-0 sm:border-r border-border-color p-3 space-y-1" id="email-folders">
					<button data-folder="inbox" class="email-folder-btn w-full text-left rounded-lg px-3 py-2 text-sm font-semibold flex items-center gap-2 bg-primary/10 text-primary"><i class="icon-inbox"></i>Inbox<span class="ml-auto text-xs" id="email-unread-count"></span></button>
					<button data-folder="starred" class="email-folder-btn w-full text-left rounded-lg px-3 py-2 text-sm font-medium flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700"><i class="icon-star"></i>Starred</button>
					<button data-folder="sent" class="email-folder-btn w-full text-left rounded-lg px-3 py-2 text-sm font-medium flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700"><i class="icon-send"></i>Sent</button>
					<button data-folder="trash" class="email-folder-btn w-full text-left rounded-lg px-3 py-2 text-sm font-medium flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-slate-700"><i class="icon-trash-2"></i>Trash</button>
				</div>
				<div class="flex-1 min-w-0">
					<div class="p-3 border-b border-border-color flex items-center gap-3">
						<div class="relative flex-1 max-w-sm">
							<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="icon-search text-sm"></i></span>
							<input aria-label="Search mail..." id="email-search" type="text" placeholder="Search mail..." class="w-full pl-9 pr-3 py-2 rounded-lg bg-gray-50 dark:bg-slate-800 text-sm border border-gray-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900">
						</div>
						<span class="text-xs text-gray-400 ml-auto" id="email-count"></span>
					</div>
					<div id="email-list" class="divide-y divide-border-color"></div>
					<div id="email-empty" class="hidden p-10 text-center text-sm text-gray-400">No messages here.</div>
				</div>
			</div>
		</div>
</div>
